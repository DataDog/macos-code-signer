name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Datadog's Apple Developer Team ID, checked in verify-macos.
  APPLE_DEVELOPER_TEAM_ID: JKFCB4CN7C

jobs:
  # Always runs; the version check itself only matters on a tag push, so
  # it's a step-level if instead of a job-level one. A mismatched tag
  # fails that step, which blocks build and package below (both just
  # need check-tag, with no special-casing of main having skipped it).
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  # Fails if a COPYING file (third-party license notices, shipped in the release
  # tarballs) is stale relative to Cargo.lock or its generator inputs.
  check-copying:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Check COPYING files are up to date
        run: scripts/gen-copying.sh --check

  # Builds the unsigned release binaries. No environment, secrets or
  # id-token: build-time code never sees signing material.
  build:
    needs: check-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Build aarch64-apple-darwin
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build x86_64-apple-darwin
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Build universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            -output target/universal-apple-darwin/release/macos-code-signer \
            target/aarch64-apple-darwin/release/macos-code-signer \
            target/x86_64-apple-darwin/release/macos-code-signer
          lipo -info target/universal-apple-darwin/release/macos-code-signer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-unsigned
          path: target/*-apple-darwin/release/macos-code-signer
          if-no-files-found: error

  # Signs build's binaries on a fresh VM. Only the signing scripts are
  # checked out, and no toolchain, cache or build code is used. Signing
  # secrets live in protected-main-env.
  sign:
    needs: build
    runs-on: macos-latest
    environment: protected-main-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/check-release-binaries.sh
            scripts/install-rcodesign.sh
            scripts/sign-legacy.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries-unsigned
          path: target
      - name: Check binaries
        run: scripts/check-release-binaries.sh target
      - name: Sign binaries
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          scripts/sign-legacy.sh sign \
            target/aarch64-apple-darwin/release/macos-code-signer \
            target/x86_64-apple-darwin/release/macos-code-signer \
            target/universal-apple-darwin/release/macos-code-signer
      - name: Verify signature
        run: |
          for bin in target/{aarch64,x86_64,universal}-apple-darwin/release/macos-code-signer; do
            codesign --verify --strict --verbose=2 "$bin"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            target/aarch64-apple-darwin/release/macos-code-signer
            target/x86_64-apple-darwin/release/macos-code-signer
            target/universal-apple-darwin/release/macos-code-signer
          if-no-files-found: error

  # Submits the signed binaries for notarization and waits. Runs on
  # Linux so --wait doesn't tie up a scarce macOS runner.
  notarize:
    needs: sign
    runs-on: ubuntu-latest
    environment: protected-main-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: target
      - name: Notarize binaries
        env:
          APPLE_APP_STORE_CONNECT_API_DATA: ${{ secrets.APPLE_APP_STORE_CONNECT_API_DATA }}
        run: scripts/sign-legacy.sh notarize target/*-apple-darwin/release/macos-code-signer

  # Final signature and notarization check, on a real macOS Gatekeeper.
  # sign produces the artifact; notarize is needed for ordering.
  verify-macos:
    needs: [sign, notarize]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: target
      - name: Verify signature, Team ID, hardened runtime and notarization
        run: |
          for bin in target/*-apple-darwin/release/macos-code-signer; do
            echo "=== $bin ==="
            codesign --verify --strict --verbose=2 "$bin"

            info="$(codesign -dvvv "$bin" 2>&1)"
            echo "$info"
            echo "$info" | grep -q "TeamIdentifier=${APPLE_DEVELOPER_TEAM_ID}"
            echo "$info" | grep -q "flags=.*runtime"

            # --check-notarization forces an online ticket lookup: a bare
            # binary can't be stapled, and a fresh runner has no cache.
            codesign --verify --check-notarization --test-requirement="=notarized" -v "$bin"
          done

  # Packages sign's (signed, notarized) binaries into the release archives. scripts/package.sh
  # only needs tar, so this runs on a Linux runner instead of the scarcer
  # macOS one.
  package:
    needs: [check-tag, check-copying, sign, verify-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: target
      - name: Resolve release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(scripts/cargo-version.sh)-${GITHUB_SHA:0:7}"
          fi
          echo "RELEASE_VERSION=$version" >>"$GITHUB_ENV"
      # download-artifact may not preserve the executable bit; package.sh
      # chmod +x's the staged binary regardless, so this doesn't need its
      # own fix.
      - name: Package release
        run: scripts/package.sh "$RELEASE_VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/

  # Only runs on a tag push (package already turned a push to main into a
  # plain packaged artifact, with nothing published).
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Publishing runs in the protected environment, so its ref restrictions
    # and any configured approval rules apply.
    environment: protected-main-env
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist
      # GitHub releases are immutable once published: every asset must be
      # attached first. Create a draft with the assets and generated notes,
      # then publish it. Never upload to an already-published release.
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
