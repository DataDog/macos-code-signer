name: Staging build

# Branches other than main only: tags never match a branch filter, and
# main and v* tags are handled by release.yml.
on:
  push:
    branches:
      - "**"
      - "!main"

permissions:
  contents: read

jobs:
  # Builds the unsigned binaries, same as release.yml's build job. No
  # secrets or id-token.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Build aarch64-apple-darwin
        run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Build x86_64-apple-darwin
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Build universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            -output target/universal-apple-darwin/release/macos-code-signer \
            target/aarch64-apple-darwin/release/macos-code-signer \
            target/x86_64-apple-darwin/release/macos-code-signer
          lipo -info target/universal-apple-darwin/release/macos-code-signer
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-binaries-unsigned
          path: target/*-apple-darwin/release/macos-code-signer
          if-no-files-found: error
          retention-days: 1

  # Signs build's binaries with the GitHub staging test certificate, using
  # the released bootstrap signer. Fresh VM, signing scripts only. The
  # OIDC token is only in the signing step's environment.
  staging-sign:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    env:
      MACOS_SIGNING_STAGING_URL: https://webhooks.build.datad0g.com
      STAGING_CERT_ID: macos-code-signer-github-application-certificate
      STAGING_CERT_AUTHORITY: "Developer ID Application: macos-code-signer GitHub Staging Application Cert (unset)"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/check-release-binaries.sh
            scripts/sign-staging.sh
            scripts/verify-staging-signature.sh
      - uses: actions/download-artifact@v8.0.2
        with:
          name: staging-binaries-unsigned
          path: target
      - name: Check binaries
        run: scripts/check-release-binaries.sh target
      - uses: DataDog/macos-code-signer@v0.2.0
        with:
          version: v0.2.0
      # Requested right before signing: the token is short-lived.
      # The request token is only sent through stdin, and errors never
      # print it or the response. No DPoP.
      - id: oidc
        name: Get OIDC token
        run: |
          set +x
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "::error::ID token request variables are not set: does the job have id-token: write?" >&2
            exit 1
          fi
          if ! [[ "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" =~ ^[!-~]+$ ]]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is not a valid header value" >&2
            exit 1
          fi
          if ! response="$(printf 'Authorization: Bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl --proto '=https' --tlsv1.2 -sf --max-time 30 -H @- \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=macos-signing-service" 2>/dev/null)"; then
            echo "::error::ID token request failed" >&2
            exit 1
          fi
          token="$(jq -r '.value // empty' <<<"$response" 2>/dev/null)" || token=""
          # A single JWT: no newline can inject workflow commands or outputs.
          if ! [[ "$token" =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            echo "::error::ID token response does not contain a JWT" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Sign binaries
        env:
          MACOS_SIGNING_SERVICE_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          MACOS_SIGNING_SERVICE_URL="$MACOS_SIGNING_STAGING_URL" \
            MACOS_CODE_SIGNER="$(command -v macos-code-signer)" \
            scripts/sign-staging.sh target staging-signed
      - name: Verify signature
        run: scripts/verify-staging-signature.sh staging-signed
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: staging-binaries-signed
          path: staging-signed
          if-no-files-found: error
          retention-days: 1
