# cargo-about configuration for COPYING (rendered with about.hbs).
# Regenerate with scripts/gen-copying.sh.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Files cargo-about misses or misreads. Checksums pin each file's content.

# ring: the crate's license map file points to these.
[ring.clarify]
license = "Apache-2.0 AND ISC AND MIT"
[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"
[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"
[[ring.clarify.files]]
path = "third_party/fiat/LICENSE"
license = "Apache-2.0"
checksum = "9eacbcb81be660840c714a560a9d65ba07913db98dd4baf969f78dd499fdd60f"
[[ring.clarify.files]]
path = "src/polyfill/once_cell/LICENSE-MIT"
license = "MIT"
checksum = "6ee2ed6c77710de911761acd5fc1ad1da00f476beb1a7ef27e78c2d1858deafc"

# liblzma-sys statically links the bundled xz liblzma, which is 0BSD.
