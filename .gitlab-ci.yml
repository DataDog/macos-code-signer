stages:
  - lint
  - test
  - build
  - notarize
  - verify
  - package
  - release

variables:
  # Only provides rustup: jobs install the toolchain from rust-toolchain.toml.
  RUST_IMAGE: registry.ddbuild.io/images/mirror/rust:1.96@sha256:1f0dbad1df66647807e6952d1db85d0b2bda7606cb2139d82517e4f009967376
  MACOS_IMAGE: 486234852809.dkr.ecr.us-east-1.amazonaws.com/ci/ci-platform-machine-images/tart-vm:shared-sequoia-latest
  AWS_CLI_IMAGE: registry.ddbuild.io/images/mirror/amazon/aws-cli:2.17.32@sha256:10ca062d9b8e8512c245f03fd0710ba7c197891658c8dcea200c1d8d0e28961c
  MACOS_RUNNER_TAG: macos:tart
  LINUX_RUNNER_TAG: arch:amd64
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RELEASE_S3_BUCKET: binaries-ddbuild-io-prod
  # Shared ci-identities job client version and linux-amd64 checksum;
  # per-job variables below pin other platform binaries.
  CI_IDENTITIES_CLIENT_VERSION: v0.9.1
  CI_IDENTITIES_CLIENT_SHA256_LINUX_AMD64: ba1e7a2c8d215ca607152987f3f92e361c1ebf63b508c02f71fc9639eff52625
  # Datadog's Apple Developer Team ID, checked in verify-macos.
  APPLE_DEVELOPER_TEAM_ID: JKFCB4CN7C

.cargo-cache:
  cache:
    key:
      prefix: $CI_JOB_NAME
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/
      - target/

.linux:
  extends: .cargo-cache
  image: $RUST_IMAGE
  tags: ["$LINUX_RUNNER_TAG"]
  before_script:
    # Installs the toolchain, components and targets from rust-toolchain.toml.
    - rustup toolchain install
    - rustup component add rustfmt clippy

.macos:
  extends: .cargo-cache
  image: $MACOS_IMAGE
  tags: ["$MACOS_RUNNER_TAG"]
  before_script:
    # The image ships rustup in ~/.cargo, but only adds it to PATH in
    # ~/.zshrc, and with an older default toolchain. The fallback below
    # installs it in $CARGO_HOME.
    - export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
    - |
      if ! command -v rustup >/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
      fi
    # rustup before 1.28 has no argument-less `toolchain install`, but
    # `show` installs the toolchain from rust-toolchain.toml.
    - rustup toolchain install || rustup show
  # macOS runners are scarcer than Linux ones, so these jobs run less often:
  # always on the default branch and on tags, elsewhere only when files that
  # affect them differ from main.
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths:
          - .gitlab-ci.yml
          - Cargo.toml
          - Cargo.lock
          - rust-toolchain.toml
          - scripts/gen-test-artifacts/**/*
          - src/**/*
          - tests/**/*
        compare_to: refs/heads/main

fmt:
  extends: .linux
  stage: lint
  cache: []
  script:
    - cargo fmt --check

shellcheck:
  stage: lint
  image: $RUST_IMAGE
  tags: ["$LINUX_RUNNER_TAG"]
  script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends shellcheck
    - shellcheck --version
    - find scripts -type f -name '*.sh' -exec shellcheck {} +

# Only runs on release tags: enforces that the tag matches Cargo.toml's
# version before build-macos and package run with it (and, via stage
# order, before release-s3).
check-release-tag:
  stage: lint
  image: $RUST_IMAGE
  tags: ["$LINUX_RUNNER_TAG"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - scripts/check-release-tag.sh "$CI_COMMIT_TAG"

clippy:
  extends: .linux
  stage: lint
  script:
    - cargo clippy --all-targets --locked

# On Linux, only the E2E error cases run: signing tests need macOS.
test-linux:
  extends: .linux
  stage: test
  needs: []
  script:
    - cargo test --locked

test-macos:
  extends: .macos
  stage: test
  needs: []
  script:
    - cargo test --locked

build-macos:
  extends: .macos
  stage: build
  # check-release-tag only exists in the pipeline on a tag (its own rules).
  # optional: true keeps branch and MR pipelines working, where it isn't
  # created and this need is a no-op. On a tag, a mismatched one stops the
  # macOS build before it even starts.
  needs:
    - job: check-release-tag
      optional: true
  # Grants Vault access on a protected ref; the script below skips
  # signing elsewhere, where the secrets aren't reachable.
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    CI_IDENTITIES_CLIENT_SHA256_DARWIN_ARM64: e7fa700d85ad0489effe0895d77350082a9c6bd7fb64a058384d308b6dd3ed5a
  script:
    - cargo build --release --locked --target aarch64-apple-darwin
    - cargo build --release --locked --target x86_64-apple-darwin
    - mkdir -p target/universal-apple-darwin/release
    - >-
      lipo -create
      -output target/universal-apple-darwin/release/macos-code-signer
      target/aarch64-apple-darwin/release/macos-code-signer
      target/x86_64-apple-darwin/release/macos-code-signer
    - lipo -info target/universal-apple-darwin/release/macos-code-signer
    # Signs only on the default branch or a v* tag: that's the only scope
    # where the Vault secrets below are reachable. MACOS_RUNNER_TAG is
    # Apple Silicon, hence the darwin-arm64 binary.
    - |
      is_trusted_ref=false
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        is_trusted_ref=true
      fi
      case "$CI_COMMIT_TAG" in
        v*) is_trusted_ref=true ;;
      esac
      if [ "$is_trusted_ref" = true ]; then
        curl --proto '=https' --tlsv1.2 -sSfL \
          -o ci-identities-ci-job-client \
          "https://binaries.ddbuild.io/ci-identities/ci-identities-ci-job-client/versions/${CI_IDENTITIES_CLIENT_VERSION}/ci-identities-ci-job-client-darwin-arm64"
        echo "${CI_IDENTITIES_CLIENT_SHA256_DARWIN_ARM64}  ci-identities-ci-job-client" | shasum -a 256 -c -
        chmod +x ci-identities-ci-job-client
        p12_b64="$(./ci-identities-ci-job-client secrets read apple-application-signing certificate)"
        p12_password="$(./ci-identities-ci-job-client secrets read apple-application-signing passphrase)"
        export APPLE_DEVELOPER_ID_APPLICATION_P12="$p12_b64"
        export APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD="$p12_password"
        scripts/sign-legacy.sh sign target/*-apple-darwin/release/macos-code-signer
        for bin in target/*-apple-darwin/release/macos-code-signer; do
          codesign --verify --strict --verbose=2 "$bin"
        done
      else
        echo "skipping signing: not a trusted ref, no secrets available"
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - target/*-apple-darwin/release/macos-code-signer

# Submits the signed binaries for notarization and waits. Runs on Linux
# so --wait doesn't tie up a scarce macOS runner. Default branch or a
# v* tag only, same scope as the signing step in build-macos.
notarize:
  stage: notarize
  image: $RUST_IMAGE
  tags: ["$LINUX_RUNNER_TAG"]
  needs:
    - build-macos
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v/
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends zip
    - >-
      curl --proto '=https' --tlsv1.2 -sSfL
      -o ci-identities-ci-job-client
      "https://binaries.ddbuild.io/ci-identities/ci-identities-ci-job-client/versions/${CI_IDENTITIES_CLIENT_VERSION}/ci-identities-ci-job-client-linux-amd64"
    - echo "${CI_IDENTITIES_CLIENT_SHA256_LINUX_AMD64}  ci-identities-ci-job-client" | sha256sum -c -
    - chmod +x ci-identities-ci-job-client
    - connect_api_json="$(./ci-identities-ci-job-client secrets read apple-connect-api-key json)"; export APPLE_APP_STORE_CONNECT_API_DATA="$connect_api_json"
    - scripts/sign-legacy.sh notarize target/*-apple-darwin/release/macos-code-signer

# Final signature and notarization check. Default branch or a v* tag
# only. build-macos is needed directly for its artifacts; notarize only
# for ordering.
verify-macos:
  extends: .macos
  stage: verify
  needs:
    - build-macos
    - job: notarize
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      for bin in target/*-apple-darwin/release/macos-code-signer; do
        echo "=== $bin ==="
        codesign --verify --strict --verbose=2 "$bin"

        info="$(codesign -dvv "$bin" 2>&1)"
        echo "$info"
        echo "$info" | grep -q "TeamIdentifier=${APPLE_DEVELOPER_TEAM_ID}"
        echo "$info" | grep -q "flags=.*runtime"

        # spctl can't assess bare binaries, so check the ticket directly.
        codesign --test-requirement="=notarized" -v "$bin"
      done

# Packages build-macos's (signed, notarized) binaries into the release
# archives. scripts/package.sh only needs tar and a sha256 tool, so this
# runs on the same Linux runner as the lint jobs instead of spending a
# scarce macOS one. Trusted refs only (main and v* tags); needs
# check-release-tag (optional, since that job only exists on a tag), so a
# tag that doesn't match Cargo.toml's version blocks packaging too.
package:
  stage: package
  image: $RUST_IMAGE
  tags: ["$LINUX_RUNNER_TAG"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v/
  # build-macos is needed directly for its artifacts; verify-macos only
  # for ordering. check-release-tag is optional: true since it only
  # exists in the pipeline on a tag.
  needs:
    - build-macos
    - job: verify-macos
      artifacts: false
    - job: check-release-tag
      optional: true
  script:
    - |
      version=""
      case "$CI_COMMIT_TAG" in
        v*) version="${CI_COMMIT_TAG#v}" ;;
      esac
      if [ -z "$version" ]; then
        version="$(scripts/cargo-version.sh)-${CI_COMMIT_SHORT_SHA}"
      fi
      scripts/package.sh "$version" dist
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

# Uploads the tag's release archives to an S3 bucket. GitHub Releases
# (release.yml) is the public distribution channel; this is the other one.
# Authenticates as the trusted-jobs CI Identity (trusted refs: main and v*
# tags). Its IAM policy only allows PutObject/GetObject under
# macos-code-signer/* and ListBucket with that prefix: no --delete, no
# --acl, nothing that needs DeleteObject or PutObjectAcl.
release-s3:
  stage: release
  # Stops concurrent tag pipelines from mixing files under latest/.
  resource_group: macos-code-signer-release
  # amazon/aws-cli sets ENTRYPOINT ["aws"], so GitLab can't run the script
  # without clearing it. The image is Amazon Linux based and has /bin/sh.
  image:
    name: $AWS_CLI_IMAGE
    entrypoint: [""]
  tags: ["$LINUX_RUNNER_TAG"]
  # dependencies (not needs) so this waits for every earlier stage (lint,
  # including check-release-tag, then test and build), not just package.
  # It still only downloads package's artifacts.
  dependencies:
    - package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  script:
    - export AWS_SHARED_CREDENTIALS_FILE="$CI_PROJECT_DIR/.aws-credentials"
    - >-
      curl --proto '=https' --tlsv1.2 -sSfL
      -o ci-identities-ci-job-client
      "https://binaries.ddbuild.io/ci-identities/ci-identities-ci-job-client/versions/${CI_IDENTITIES_CLIENT_VERSION}/ci-identities-ci-job-client-linux-amd64"
    - echo "${CI_IDENTITIES_CLIENT_SHA256_LINUX_AMD64}  ci-identities-ci-job-client" | sha256sum -c -
    - chmod +x ci-identities-ci-job-client
    - ./ci-identities-ci-job-client assume-role --account-id 486234852809
    - version="${CI_COMMIT_TAG#v}"
    - aws s3 cp dist/ "s3://${RELEASE_S3_BUCKET}/macos-code-signer/${version}/" --recursive
    - mkdir -p latest
    - scripts/package.sh --latest dist latest
    - aws s3 cp latest/ "s3://${RELEASE_S3_BUCKET}/macos-code-signer/latest/" --recursive
