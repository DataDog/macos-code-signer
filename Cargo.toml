[package]
name = "macos-code-signer"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Sign macOS artifacts with a Developer ID certificate held by a remote signing service"
license = "Apache-2.0"
repository = "https://github.com/DataDog/macos-code-signer"
readme = "README.md"
keywords = ["macos", "codesign", "notarization", "developer-id"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
apple-codesign = { version = "0.29.0", default-features = false }
base64 = "0.23.1"
bytes = "1.11.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
reqwest = { version = "0.12.22", default-features = false, features = [
    "blocking",
    "http2",
    "json",
    "rustls-tls-native-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
signature = "2.2.0"
url = "2.5.7"
x509-certificate = "0.24.0"
zeroize = "1.8.1"

[dev-dependencies]
apple-xar = "0.20.0"
rsa = { version = "0.9.10", features = ["sha2"] }
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["full", "test-util"] }
wiremock = "0.6.5"

[lints.clippy]
all = { level = "deny", priority = -1 }
uninlined_format_args = "allow"
diverging_sub_expression = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

