[package]
name = "macos-code-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Sign macOS artifacts with a Developer ID certificate held by a remote signing service"
repository = "https://github.com/DataDog/macos-code-signer"
readme = "README.md"
keywords = ["macos", "codesign", "notarization", "developer-id"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
apple-codesign = { version = "0.29.0", default-features = false }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
reqwest = { version = "0.12.22", default-features = false, features = [
    "blocking",
    "http2",
    "json",
    "rustls-tls-native-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10"
signature = "2.2.0"
url = "2.5.7"
x509-certificate = "0.25.0"
zeroize = "1.8.1"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["full", "test-util"] }
wiremock = "0.6.5"

[lints.clippy]
all = { level = "deny", priority = -1 }
uninlined_format_args = "allow"
diverging_sub_expression = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# apple-codesign 0.29.0 on crates.io depends on x509-certificate 0.24, but this crate implements
# x509-certificate 0.25 traits. Upstream already uses 0.25 at this rev, with no release cut yet.
# apple-xar is patched to the same rev to keep the dependency set on one consistent commit.
[patch.crates-io]
apple-codesign = { git = "https://github.com/indygreg/apple-platform-rs", rev = "1aef8f7f467fe241f6a24cf2b07afb477f448a50" }
apple-xar = { git = "https://github.com/indygreg/apple-platform-rs", rev = "1aef8f7f467fe241f6a24cf2b07afb477f448a50" }
